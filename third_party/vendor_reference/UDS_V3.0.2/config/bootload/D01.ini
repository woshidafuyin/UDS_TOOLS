#################################################################################
##注意事项：
##符号均使用英文符号，禁止中文符号
##“;”分号之后为注释内容
[Radar_Location]
0=D01_FLCR
1=D01_FRCR
2=D01_RLCR
3=D01_RRCR

[D01_FLCR]
Tx_ID = 0x74C
Rx_ID = 0x7CC
Fun_ID= 0x7DF

[D01_FRCR]
Tx_ID = 0x74D
Rx_ID = 0x7CD
Fun_ID= 0x7DF

[D01_RLCR]
Tx_ID = 0x743
Rx_ID = 0x7C3
Fun_ID= 0x7DF

[D01_RRCR]
Tx_ID = 0x744
Rx_ID = 0x7C4
Fun_ID= 0x7DF

[config]
AbitBaudRate=500000;               仲裁域波特率
DbitBaudRate=2000000;              数据域波特率
FrameType=1;                       0:CAN帧    1:CANFD帧
CanfdStandard=0;                   CANFD标准 0:CANFD ISO    1:CANFD BOSCH
FillByte=0x00;                     数据填充
FlowStatus=0x00;                   FS
BlockSize=0x00;                    BS
STmin=0x00;
p2can_server_max=500;              刷新诊断请求的响应超时最大时间(ms)
p2xcan_server_max=5000;            NRC78的超时判断最大时间(ms)
PeriodMsg=;			               周期唤醒报文(例:450 08 50 40 01 00 00 00 00 00) ID + dlc + data

[NRC]
0x7F107F = 
#################################################################################
## Bootload刷新配置，请按照项目刷新流程自行配置
## ";"分号后为注释内容
## [Start]									# 刷新流程入口，不可修改
## Start = Step01;							# 刷新步骤
## Delay = 10;                              # 全局默认发送一帧报文后的延时 
## 
## [Step]
## Notes =;						  			# 注释
## IsFunID=1;								# 是否使用[config]中的FUN_ID
## Tx=10 03;						        # 发送报文				
## Rx=50 03 00 32 01 F4;			        # 接收报文
## Delay = 1000;					        # 接收到正确响应报文后的延时(单位毫秒)
## TxAlgorithm =;					        # 算法拼接到Tx后
## RxAlgorithm =;					        # 算法拼接到Rx后
## Function =;						        # 上位机根据Function触发不同的操作
## NextStep = Step02;				        # 下一步

##刷新流程
[Start]
Start = Step01;
Delay =;全局默认发送一帧报文后的延时

