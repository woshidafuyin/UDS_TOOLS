##############################################################################
##注意事项：
##符号均使用英文符号
##“;”分号之后为注释内容
[Radar_Location]
0=D01_FLCR
1=D01_FRCR
2=D01_RLCR
3=D01_RRCR

[D01_FLCR]
Tx_ID = 0x74C
Rx_ID = 0x7CC
Fun_ID= 0x7DF

[D01_FRCR]
Tx_ID = 0x74D
Rx_ID = 0x7CD
Fun_ID= 0x7DF

[D01_RLCR]
Tx_ID = 0x743
Rx_ID = 0x7C3
Fun_ID= 0x7DF

[D01_RRCR]
Tx_ID = 0x744
Rx_ID = 0x7C4
Fun_ID= 0x7DF

[config]
AbitBaudRate=500000;			仲裁域波特率
DbitBaudRate=2000000;			数据域波特率
FrameType=1;					0 : can帧    1 : canfd帧
CanfdStandard=0;				CANFD标准 0 : CANFD ISO    1 : CANFD BOSCH
FillByte=0x00;					数据填充
FlowStatus=0x00;				FS
BlockSize=0x00;					BS
STmin=0x00;
$27_DLL_Name=TSMaster_D01_BSD.dll;		$27服务 安全算法dll库，请严格按照dll文件名填写，大小写必须对应，不建议使用中文名
PeriodMsg=600 08 00;

##############################################################################
##数据均为16进制
##SID:诊断服务的服务 ID。
##FUN:诊断服务的子功能 。
##PID:诊断服务的参数 ID
##服务解析需要加入空格分割 例:0=0xFD29 RD_Turn_Calibration

[SID]
0=0x11 ECU Reset
1=0x14 Clear Diagnostic Information
2=0x19 Read DTC Information
3=0x22 Read Data By Identifier
4=0x28 Communication Control
5=0x2A Read Data By Periodic Identifier
6=0x2C Define By Identifier
7=0x2E Write Data By Identifier
8=0x2F Input Output Control By Identifier
9=0x3E Tester Present
10=0x85 Control DTC Setting

[$10_FUN]
0=0x01 Default Session
1=0x02 Programing Session
2=0x03 Extended Diagnostic Session

[$11_FUN]
0=0x01 Hard Reset
1=0x02 Key Off On Reset
2=0x03 Soft Reset
3=0x04 Enable Rapid Power Shut Down
4=0x05 Disable Rapid Power Shut Down

[$19_FUN]
0=0x01 Read DTC Information
1=0x02 Report DTC By Status Mask
2=0x04 Report DTC Snapshot Record By DTC Number
3=0x06 Report DTC Extended Datar Record By DTC Number
4=0x0A Report Supported DTC

[$27_FUN]
0=0x01 02
1=0x03 04
2=0x05 06
3=0x07 08
4=0x09 10
5=0x11 12

[$28_FUN]
0=0x00 Enable Rx And Tx
1=0x80 Enable Rx And Tx Suppress Pos Res
2=0x03 Disable Rx And Tx
3=0x83 Normal Communication Messages

[$2A_FUN]
0=0x01 Send At Slow Rate
1=0x02 Send At Medium Rate
2=0x03 Send At Fast Rate
3=0x04 Stop Sending

[$2C_FUN]
0=0x01 Define By Identifier
1=0x02 Define By Memory Address
2=0x03 Clear Dynamically Defined Data Identifier

[$2F_FUN]
0=0x00 Return Control To ECU
1=0x01 Reset To Default
2=0x02 Freeze Current State
3=0x03 Short Term Adjustment

[$31_FUN]
0=0x01 Start Routine
1=0x02 Stop Routine
2=0x03 Result Routine

[$3E_FUN]
0=0x00 Test Present
1=0x80 Test Present Suppress Pos Res

[$85_FUN]
0=0x01 DTC Logging On
1=0x81 DTC Logging On Suppress Pos Res
2=0x02 DTC Logging Off
3=0x82 DTC Logging Off Suppress Pos Res

[$14_PID]
0=0xFFFFFF All DTC

[$19_PID]
0=0x09
1=0xFF

[$22_PID]
0=0xF15B Read_Fingerprint
1=0xF012 Read_HardwarePartNumber
2=0xF013 Read_SoftwarePartNumber
3=0x4903 Request_SystemState
4=0xF031 Read_CalibrationDataPartNumber
5=0xF032 Read_BootSoftwareIdentification
6=0xF180 Read_BootSoftwareIdentification
7=0xF187 Read_SparePartNumber
8=0xF188 Read_ECUSoftwareVersionNumber
9=0xF18A Read_SystemSupplierIdentifier
10=0xF18B Read_ECUManufacturingDate
11=0xF18C Read_ECUSerialNumber
12=0xF190 Read_VINDataIdentifier
13=0xF191 Read_ECUHardwareNumber
14=0xF193 Read_SystemSupplierECUHardwareVersionNumber
15=0xF195 Read_SystemSupplierECUSoftwareVersionNumber
16=0xF197 Read_SystemNameorEngineType
17=0xF1E7 Read_SystemSupplierECUCalibrationDataPartNumber
18=0xF1E8 Read_SystemSupplierECUSoftwarePartNumber
19=0x764A ECUPowerSupplyVoltage
20=0xFE10 temperature
21=0xFE20 HSD_IO
22=0xF033 VehicleManufacturerCalibrationVersionNumber
23=0x12F1 LOC_PIN


[$28_PID]
0=0x01 Normal Communication Messages
1=0x02 Network Management Communication Messages
2=0x03 Normal and Network Management Communication Messages

[$31_PID]
0=0xD003 CheckProgrammingPrecondition
1=0x0001040A 10m_target_level_phase
2=0x00010001 RAW_Target
3=0x0005 quicksleep


[$19_DTC]
570016=电源电压低
570117=电源电压高
570276=雷达安装角度错误
570311=LED短路故障
570492=雷达遮挡
570556=配置无效
57064B=系统温度过高
570742=内部电子元件错误
C07388=VCAN总线关闭
C12987=Lost Communication With BSM
C10087=Lost Communication With EMS
C15587=Lost Communication With ICM
C10187=Lost Communication With TCU
C41881=Invalid Data Received From BSM
C40181=Invalid Data Received From EMS
C42381=Invalid Data Received From ICM
C40281=Invalid Data Received From TCU
F00051=Control Module Not Programmed
D01088=PCAN总线关闭
D19887=Lost Communication With RLCR(private CAN)
D19987=Lost Communication With RRCR(private CAN)
D43881=Invalid data received from RLCR(private CAN)
D43981=Invalid data received from RRCR(private CAN)


