0=进入Boot
1=天线参数校准
2=配置二

[Cmd0]
0=10 01 Sleep:500
1=10 03 Sleep:500
2= 31 01 02 03 Sleep:500
3=85 82 Sleep:500
4=28 83 Sleep:500
5=22 F1 84 Sleep:500
6=10 02


[Cmd1]
0=10 03 Sleep:500
1=27 01 Sleep:500
2=31 01 00 06 64 32

[Cmd2]
0=19 0A Sleep:500
1=10 01